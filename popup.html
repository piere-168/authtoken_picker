<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper.id Auth Token</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sub {
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 12px;
      word-break: break-all;
    }
    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      padding: 8px;
      line-height: 1.4;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .primary { background: var(--accent); color: #052e16; }
    .primary:hover { background: var(--accent-hover); color: #fff; }
    .ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .ghost:hover { background: var(--border); }
    .meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 10px;
    }
    .empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 24px 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>🔑 Paper.id Auth Token</h1>
  <p class="sub" id="source">Belum ada token ketangkep.</p>

  <textarea id="token" readonly placeholder="Buka/refresh halaman paper.id dulu, token bakal muncul di sini..."></textarea>

  <div class="row">
    <button class="primary" id="copy">Copy Token</button>
    <button class="ghost" id="copyBearer">Copy "Bearer ..."</button>
  </div>
  <div class="row">
    <button class="ghost" id="clear">Hapus</button>
  </div>

  <div class="meta" id="meta"></div>

  <script src="popup.js"></script>
</body>
</html>
